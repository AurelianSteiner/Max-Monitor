name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

# Least privilege: every job here only reads the repository. upload-artifact
# talks to the Actions runtime, not to the repo, so it needs no extra scope.
permissions:
  contents: read

jobs:
  unit-tests:
    name: Swift Unit Tests
    runs-on: macos-26
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      - name: Run swift test
        run: swift test

  build-app:
    name: Build App (compile check)
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      # Compiles the full app target (App/, Views/, Services/, …) that `swift test`
      # does not cover. No signing — this is a compile check, not a release build.
      - name: Build app (Debug, no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Usage4Claude.xcodeproj \
            -scheme Usage4Claude \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  package-app:
    name: Package runnable app (ad-hoc signed)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.6"

      # Produces a runnable, ad-hoc-signed .app (no Apple account required) and
      # uploads it as a downloadable artifact, so the app can be run without Xcode:
      # download the artifact, unzip, right-click -> Open (Gatekeeper prompt, since
      # it is not notarized).
      - name: Build Release (ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Usage4Claude.xcodeproj \
            -scheme Usage4Claude \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM=""

      - name: Zip app
        run: |
          APP="build/Build/Products/Release/Usage4Claude.app"
          if [ ! -d "$APP" ]; then
            echo "App not found at $APP; searching:"; find build -maxdepth 5 -name '*.app'
            exit 1
          fi
          ditto -c -k --keepParent "$APP" "Max-Monitor.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Max-Monitor-app
          path: Max-Monitor.zip
          if-no-files-found: error

  python-script-tests:
    name: Python Script Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run check_l10n.py tests
        run: python3 scripts/test_check_l10n.py -v

      - name: Check localization consistency
        run: python3 scripts/check_l10n.py
